name: CI/CD

on:
  push:
    branches: ["master", "task-final"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyLLMService
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: MyLLMService/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install linter
        run: python -m pip install ruff

      - name: Run linter
        run: ruff check app tests gradio_app.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check compilation
        run: python -m compileall -q app tests gradio_app.py
